<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StockGyan Magic Screener</title>
<style>
:root{--navy:#082a63;--green:#159447;--orange:#f28c28;--bg:#f4f7fb;--card:#fff;--text:#14213d;--muted:#68758a;--border:#dfe6ef;--red:#c83b50}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
header{background:var(--navy);color:#fff;padding:16px 5%;display:flex;align-items:center;justify-content:space-between;gap:20px;position:sticky;top:0;z-index:10}
.brand{font-size:25px;font-weight:800}.brand span{color:var(--orange)}
nav a{color:#fff;text-decoration:none;margin-left:20px;font-weight:600}
.container{max-width:1250px;margin:28px auto;padding:0 18px}
.hero{background:linear-gradient(135deg,#082a63,#114c9b);color:#fff;border-radius:18px;padding:28px;margin-bottom:20px}
.hero h1{margin:0 0 8px;font-size:32px}.hero p{margin:0;color:#dbe7ff}
.searchbox{display:flex;gap:10px;margin-top:22px}
.searchbox input{flex:1;padding:14px 16px;border-radius:10px;border:0;font-size:16px}
button{border:0;border-radius:10px;padding:13px 18px;font-weight:700;cursor:pointer;background:var(--orange);color:#fff}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:20px;box-shadow:0 4px 18px rgba(8,42,99,.05)}
.card h2{margin:0 0 16px;color:var(--navy);font-size:21px}
.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.metric{background:#f7f9fc;border:1px solid var(--border);padding:15px;border-radius:12px}
.metric small{display:block;color:var(--muted);margin-bottom:7px}.metric strong{font-size:20px}
.green{color:var(--green)}.red{color:var(--red)}
.filters{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.filters label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}
.filters input,.filters select{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;background:#fff}
.actions{display:flex;gap:10px;margin-top:15px;flex-wrap:wrap}
.secondary{background:var(--navy)}
.tablewrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:900px}
th,td{padding:12px;border-bottom:1px solid var(--border);text-align:left}
th{background:#f5f8fc;color:var(--navy);font-size:13px}
tr:hover{background:#fafcff;cursor:pointer}
.badge{padding:5px 8px;border-radius:20px;font-weight:700;font-size:12px}
.pos{background:#e4f6eb;color:#08743a}.neg{background:#fde8ec;color:#a6263b}.neu{background:#edf1f6;color:#536174}
.result{margin-top:12px}.status{color:var(--muted);font-size:14px;margin:10px 0}
.empty{padding:30px;text-align:center;color:var(--muted)}
@media(max-width:900px){.metrics,.filters{grid-template-columns:repeat(2,1fr)}header{padding:14px 18px}nav{display:none}}
@media(max-width:520px){.metrics,.filters{grid-template-columns:1fr}.searchbox{flex-direction:column}.hero h1{font-size:25px}}
</style>
</head>
<body>

<header>
<div class="brand">Stock<span>Gyan</span></div>
<nav><a href="/">Home</a><a href="/market/">Market</a><a href="/screener/">Screener</a></nav>
</header>

<main class="container">

<section class="hero">
<h1>Magic Screener</h1>
<p>Search stocks, scan market momentum and build your own stock shortlist.</p>
<div class="searchbox">
<input id="searchInput" placeholder="Search stock — e.g. Reliance, TCS, HDFC Bank">
<button onclick="searchStock()">Search</button>
</div>
<div id="searchResults" class="result"></div>
</section>

<section id="selectedCard" class="card" style="display:none">
<h2 id="selectedTitle">Stock</h2>
<div class="metrics">
<div class="metric"><small>Last Price</small><strong id="mPrice">—</strong></div>
<div class="metric"><small>Daily Change</small><strong id="mChange">—</strong></div>
<div class="metric"><small>Volume</small><strong id="mVolume">—</strong></div>
<div class="metric"><small>52W High</small><strong id="mHigh">—</strong></div>
<div class="metric"><small>52W Low</small><strong id="mLow">—</strong></div>
</div>
<div class="status" id="selectedStatus"></div>
</section>

<section class="card">
<h2>Magic Screener Filters</h2>
<div class="filters">
<div><label>Minimum Daily %</label><input id="minChange" type="number" step="0.1" placeholder="e.g. 1"></div>
<div><label>Maximum Daily %</label><input id="maxChange" type="number" step="0.1" placeholder="e.g. 5"></div>
<div><label>Minimum Price ₹</label><input id="minPrice" type="number" placeholder="e.g. 100"></div>
<div><label>Maximum Price ₹</label><input id="maxPrice" type="number" placeholder="e.g. 5000"></div>
<div><label>Signal</label>
<select id="signal">
<option value="all">All stocks</option>
<option value="gainers">Gainers only</option>
<option value="losers">Losers only</option>
<option value="breakout">Near 52W high</option>
<option value="low52">Near 52W low</option>
</select>
</div>
</div>
<div class="actions">
<button onclick="runScreener()">Run Magic Screener</button>
<button class="secondary" onclick="resetFilters()">Reset</button>
</div>
<div class="status" id="screenStatus">Loading market universe…</div>
</section>

<section class="card">
<h2>Screener Results</h2>
<div class="tablewrap">
<table>
<thead>
<tr>
<th>Stock</th><th>Price</th><th>Day %</th><th>Volume</th><th>52W High</th><th>52W Low</th><th>52W Position</th>
</tr>
</thead>
<tbody id="resultsBody"></tbody>
</table>
</div>
</section>

</main>

<script>
const moverUniverse=[
["RELIANCE","NSE_EQ|INE002A01018"],
["HDFCBANK","NSE_EQ|INE040A01034"],
["ICICIBANK","NSE_EQ|INE090A01021"],
["BHARTIARTL","NSE_EQ|INE397D01024"],
["INFY","NSE_EQ|INE009A01021"],
["TCS","NSE_EQ|INE467B01029"],
["SBIN","NSE_EQ|INE062A01020"],
["LT","NSE_EQ|INE018A01030"],
["AXISBANK","NSE_EQ|INE238A01034"],
["KOTAKBANK","NSE_EQ|INE237A01028"],
["M&M","NSE_EQ|INE101A01026"],
["ITC","NSE_EQ|INE154A01025"],
["HINDUNILVR","NSE_EQ|INE030A01027"],
["BAJFINANCE","NSE_EQ|INE296A01024"],
["SUNPHARMA","NSE_EQ|INE044A01036"],
["NTPC","NSE_EQ|INE733E01010"],
["TATASTEEL","NSE_EQ|INE081A01020"],
["POWERGRID","NSE_EQ|INE752E01010"],
["HCLTECH","NSE_EQ|INE860A01027"],
["MARUTI","NSE_EQ|INE585B01010"],
["TITAN","NSE_EQ|INE280A01028"],
["BAJAJFINSV","NSE_EQ|INE918I01026"],
["ADANIPORTS","NSE_EQ|INE742F01042"],
["ULTRACEMCO","NSE_EQ|INE481G01011"],
["ONGC","NSE_EQ|INE213A01029"],
["COALINDIA","NSE_EQ|INE522F01014"],
["JSWSTEEL","NSE_EQ|INE019A01038"],
["HINDALCO","NSE_EQ|INE038A01020"],
["BEL","NSE_EQ|INE263A01024"],
["WIPRO","NSE_EQ|INE075A01022"]
];

let universeData=[];
let selectedInstrument=null;

async function loadUniverse(){
try{
const keys=moverUniverse.map(x=>x[1]).join(",");
const res=await fetch("/api/market/batch?instrument_keys="+encodeURIComponent(keys));
const json=await res.json();

if(json.status!=="success"){
throw new Error(json.message||"Market data unavailable");
}

const data=json.data||{};

universeData=moverUniverse.map(([symbol,key])=>{
const q=data[key]||data[key.replace("|",":")]||data[symbol]||{};
const price=Number(q.last_price??q.ltp??q.price??0);
const change=Number(
q.change_percent??
q.percent_change??
(q.prev_close>0?(q.change/q.prev_close)*100:0)
);

return{
symbol,
key,
price,
change,
volume:Number(q.volume??0),
high52:0,
low52:0
};

}).filter(x=>x.price>0);

document.getElementById("screenStatus").textContent=
`Loaded ${universeData.length} stocks. Loading 52-week data…`;

await load52WeekRanges();

document.getElementById("screenStatus").textContent=
`Loaded ${universeData.length} stocks with 52-week data.`;

runScreener();

}catch(e){
document.getElementById("screenStatus").textContent=
"Unable to load market universe: "+e.message;
}
}

async function load52WeekRanges(){

await Promise.all(
universeData.map(async stock=>{

try{

const res=await fetch(
"/api/market/ohlc?instrument_key="+
encodeURIComponent(stock.key)+
"&interval=1d"
);

const json=await res.json();

const candles=
json.data?.candles||
json.data?.data?.candles||
[];

if(!candles.length)return;

/*
Upstox candle format:
[ timestamp, open, high, low, close, volume, open_interest ]
*/

const highs=candles
.map(c=>Number(c[2]))
.filter(p=>p>0);

const lows=candles
.map(c=>Number(c[3]))
.filter(p=>p>0);

if(highs.length){
stock.high52=Math.max(...highs);
}

if(lows.length){
stock.low52=Math.min(...lows);
}

}catch(error){

console.log(
"52-week data unavailable for",
stock.symbol,
error
);

}

})
);

}

function runScreener(){

const minC=parseFloat(document.getElementById("minChange").value);
const maxC=parseFloat(document.getElementById("maxChange").value);
const minP=parseFloat(document.getElementById("minPrice").value);
const maxP=parseFloat(document.getElementById("maxPrice").value);
const signal=document.getElementById("signal").value;

let rows=universeData.filter(x=>{

if(!isNaN(minC)&&x.change<minC)return false;
if(!isNaN(maxC)&&x.change>maxC)return false;
if(!isNaN(minP)&&x.price<minP)return false;
if(!isNaN(maxP)&&x.price>maxP)return false;

if(signal==="gainers"&&x.change<=0)return false;
if(signal==="losers"&&x.change>=0)return false;

if(signal==="breakout"&&
!(x.high52>0&&x.price>=x.high52*0.95))return false;

if(signal==="low52"&&
!(x.low52>0&&x.price<=x.low52*1.05))return false;

return true;

}).sort((a,b)=>b.change-a.change);

const body=document.getElementById("resultsBody");

if(!rows.length){
body.innerHTML=
'<tr><td colspan="7" class="empty">No stocks match these filters.</td></tr>';
return;
}

body.innerHTML=rows.map(x=>{

const pos=
x.high52>x.low52
?((x.price-x.low52)/(x.high52-x.low52)*100)
:0;

const cls=
x.change>0?"pos":
x.change<0?"neg":"neu";

return`
<tr onclick="selectUniverseStock('${x.symbol}')">
<td><strong>${x.symbol}</strong></td>
<td>₹${fmt(x.price)}</td>
<td><span class="badge ${cls}">${fmtSigned(x.change)}%</span></td>
<td>${fmt(x.volume)}</td>
<td>${x.high52?`₹${fmt(x.high52)}`:"—"}</td>
<td>${x.low52?`₹${fmt(x.low52)}`:"—"}</td>
<td>${x.high52>x.low52?fmt(pos)+"%":"—"}</td>
</tr>`;

}).join("");

}

function selectUniverseStock(symbol){

const x=universeData.find(v=>v.symbol===symbol);

if(!x)return;

selectedInstrument=x.key;

showSelected(
x.symbol,
x.price,
x.change,
x.volume,
x.high52,
x.low52,
""
);

loadTechnical(x.key,x.symbol);
}

async function searchStock(){

const q=document.getElementById("searchInput").value.trim();
const box=document.getElementById("searchResults");

if(!q){
box.innerHTML="";
return;
}

box.innerHTML="Searching…";

try{

const res=await fetch(
"/api/market/search?query="+encodeURIComponent(q)
);

const json=await res.json();

if(json.status!=="success"){
box.textContent=json.message||"Search failed";
return;
}

const arr=json.data||json.results||[];

if(!arr.length){
box.textContent="No matching stocks found.";
return;
}

box.innerHTML=arr.slice(0,10).map(x=>{

const name=x.name||x.trading_symbol||x.symbol||"Stock";
const sym=x.trading_symbol||x.symbol||"";
const key=x.instrument_key||"";

return`
<div style="background:#fff;color:#14213d;padding:12px;margin-top:8px;border-radius:9px;cursor:pointer"
onclick='selectSearch(${JSON.stringify(sym)},${JSON.stringify(key)})'>
<strong>${sym}</strong> — ${name}<br>
<small style="color:#68758a">${x.exchange||""} ${x.segment||""}</small>
</div>`;

}).join("");

}catch(e){

box.textContent="Search error: "+e.message;

}

}

async function selectSearch(symbol,key){

document.getElementById("searchResults").innerHTML="";

if(!key)return;

selectedInstrument=key;

try{

const res=await fetch(
"/api/market/quote?instrument_key="+
encodeURIComponent(key)
);

const json=await res.json();

const data=json.data||{};

const q=
data[key]||
data[key.replace("|",":")]||
Object.values(data)[0]||
{};

const price=
Number(q.last_price??q.ltp??q.price??0);

const change=
Number(
q.change_percent??
q.percent_change??
(q.prev_close>0?(q.change/q.prev_close)*100:0)
);

showSelected(
symbol,
price,
change,
Number(q.volume??0),
0,
0,
"Live quote"
);

loadTechnical(key,symbol);
loadSelected52Week(key);

}catch(e){

document.getElementById("selectedStatus").textContent=
"Unable to load quote: "+e.message;

}

}

async function loadSelected52Week(key){

try{

const res=await fetch(
"/api/market/ohlc?instrument_key="+
encodeURIComponent(key)+
"&interval=1d"
);

const json=await res.json();

const candles=
json.data?.candles||
json.data?.data?.candles||
[];

const highs=candles.map(c=>Number(c[2])).filter(x=>x>0);
const lows=candles.map(c=>Number(c[3])).filter(x=>x>0);

const high=highs.length?Math.max(...highs):0;
const low=lows.length?Math.min(...lows):0;

document.getElementById("mHigh").textContent=
high?"₹"+fmt(high):"—";

document.getElementById("mLow").textContent=
low?"₹"+fmt(low):"—";

}catch(e){

console.log("Selected 52W data unavailable",e);

}

}

function showSelected(
symbol,
price,
change,
volume,
high,
low,
status
){

document.getElementById("selectedCard").style.display="block";

document.getElementById("selectedTitle").textContent=symbol;

document.getElementById("mPrice").textContent=
"₹"+fmt(price);

const el=document.getElementById("mChange");

el.textContent=fmtSigned(change)+"%";

el.className=
change>=0?"green":"red";

document.getElementById("mVolume").textContent=
fmt(volume);

document.getElementById("mHigh").textContent=
high?"₹"+fmt(high):"—";

document.getElementById("mLow").textContent=
low?"₹"+fmt(low):"—";

document.getElementById("selectedStatus").textContent=status;

}

async function loadTechnical(key,symbol){

const status=document.getElementById("selectedStatus");

status.textContent=
`Loading technical data for ${symbol}…`;

try{

const res=await fetch(
"/api/market/ohlc?instrument_key="+
encodeURIComponent(key)+
"&interval=1d"
);

const json=await res.json();

const candles=
json.data?.candles||
json.data?.data?.candles||
[];

const closes=
candles
.map(c=>Number(c[4]))
.filter(x=>x>0)
.reverse();

const rsi=calcRSI(closes,14);

status.textContent=
`Daily RSI(14): ${
rsi===null?"—":rsi.toFixed(2)
} • ${candles.length} historical candles loaded`;

}catch(e){

status.textContent=
"Technical data unavailable: "+e.message;

}

}

function calcRSI(values,period){

if(values.length<=period)return null;

let gains=0,losses=0;

for(let i=1;i<=period;i++){

const d=values[i]-values[i-1];

if(d>0)gains+=d;
else losses-=d;

}

let avgGain=gains/period;
let avgLoss=losses/period;

for(let i=period+1;i<values.length;i++){

const d=values[i]-values[i-1];
const g=Math.max(d,0);
const l=Math.max(-d,0);

avgGain=
(avgGain*(period-1)+g)/period;

avgLoss=
(avgLoss*(period-1)+l)/period;

}

if(avgLoss===0)return 100;

return 100-(100/(1+avgGain/avgLoss));

}

function resetFilters(){

["minChange","maxChange","minPrice","maxPrice"]
.forEach(id=>{
document.getElementById(id).value="";
});

document.getElementById("signal").value="all";

runScreener();

}

function fmt(n){

if(!Number.isFinite(Number(n)))return"—";

return Number(n).toLocaleString(
"en-IN",
{maximumFractionDigits:2}
);

}

function fmtSigned(n){

const v=Number(n);

if(!Number.isFinite(v))return"—";

return(v>0?"+":"")+v.toFixed(2);

}

document
.getElementById("searchInput")
.addEventListener("keydown",e=>{
if(e.key==="Enter")searchStock();
});

loadUniverse();

</script>
</body>
</html>
