<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>StockGyan Admin</title>
<style>
:root{--navy:#082a63;--green:#159447;--orange:#f28c28;--bg:#f4f7fb;--card:#fff;--text:#182230;--muted:#667085;--border:#dfe5ee;--danger:#c62828}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}
.login-card{width:min(420px,100%);background:#fff;padding:30px;border-radius:18px;box-shadow:0 12px 40px #082a6320}
.logo{font-size:28px;font-weight:800;color:var(--navy);margin-bottom:8px}.logo span{color:var(--green)}
.muted{color:var(--muted)}.field{margin:14px 0}.field label{display:block;font-weight:700;margin-bottom:7px}
input,select,textarea{width:100%;border:1px solid var(--border);border-radius:9px;padding:11px;background:#fff}
textarea{min-height:140px;resize:vertical}
.btn{border:0;border-radius:9px;padding:11px 16px;font-weight:700}.primary{background:var(--navy);color:#fff}.green{background:var(--green);color:#fff}.orange{background:var(--orange);color:#fff}.light{background:#eef3f9;color:var(--navy)}
.error{color:var(--danger);margin-top:10px;font-weight:700}.success{color:var(--green);font-weight:700}
#app{display:none}.top{height:64px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:10}
.top b{font-size:21px}.top span{color:#8ee3ac}.top-right{display:flex;gap:10px;align-items:center}.logout{background:#fff;color:var(--navy);border:0;border-radius:8px;padding:8px 12px;font-weight:700}
.layout{display:flex;min-height:calc(100vh - 64px)}aside{width:230px;background:#fff;border-right:1px solid var(--border);padding:18px 12px}
.navbtn{width:100%;text-align:left;border:0;background:transparent;padding:12px;border-radius:8px;margin-bottom:5px;font-weight:700;color:#344054}.navbtn:hover,.navbtn.active{background:#eaf1fb;color:var(--navy)}
main{flex:1;padding:24px;min-width:0}.page-title{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}
.page-title h1{margin:0;color:var(--navy)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.stat{background:#fff;border:1px solid var(--border);border-radius:14px;padding:20px}.stat .num{font-size:30px;font-weight:800;color:var(--navy);margin-top:6px}
.panel{background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:18px}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--border);vertical-align:top}th{background:#f8fafc;color:#344054}
.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#eaf7ef;color:#176b35;font-size:12px;font-weight:700}
.actions{display:flex;gap:8px;flex-wrap:wrap}.actions a{display:inline-block;text-decoration:none}.small{padding:7px 10px;font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}
.notice{background:#fff8e8;border:1px solid #f5d18c;padding:12px;border-radius:9px;margin-bottom:15px}
.hidden{display:none!important}
@media(max-width:800px){aside{width:190px}.cards{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}main{padding:15px}}
@media(max-width:600px){.layout{display:block}aside{width:100%;display:flex;overflow:auto;gap:5px;border-right:0;border-bottom:1px solid var(--border)}.navbtn{white-space:nowrap;width:auto}.top{padding:0 12px}.top-right{font-size:12px}}
</style>
</head>
<body>

<div id="login" class="login-wrap">
  <div class="login-card">
    <div class="logo">Stock<span>Gyan</span></div>
    <p class="muted">Admin Dashboard</p>
    <form id="loginForm">
      <div class="field">
        <label for="pin">Admin PIN</label>
        <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" required>
      </div>
      <button class="btn primary" style="width:100%">Login</button>
      <div id="loginMsg"></div>
    </form>
  </div>
</div>

<div id="app">
<header class="top">
  <b>Stock<span>Gyan</span> Admin</b>
  <div class="top-right"><span id="adminStatus">Secure session</span><button class="logout" id="logoutBtn">Logout</button></div>
</header>

<div class="layout">
<aside>
  <button class="navbtn active" data-page="dashboard">📊 Dashboard</button>
  <button class="navbtn" data-page="enquiries">📩 Enquiries</button>
  <button class="navbtn" data-page="content">📝 Content</button>
  <button class="navbtn" data-page="add">➕ Add Content</button>
</aside>

<main id="main"></main>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
const main=$('main');

async function api(url, options={}){
  const res=await fetch(url,{
    credentials:'same-origin',
    cache:'no-store',
    ...options,
    headers:{'Accept':'application/json',...(options.headers||{})}
  });
  const type=res.headers.get('content-type')||'';
  const text=await res.text();
  let data=null;
  if(type.includes('application/json')){
    try{data=JSON.parse(text)}catch(e){}
  }
  if(!res.ok) throw new Error((data&&data.error)||`HTTP ${res.status}`);
  if(!data) throw new Error('Server returned HTML instead of JSON. API route is not being handled by the admin Function.');
  return data;
}

function showLogin(){ $('app').style.display='none'; $('login').style.display='grid'; }
function showApp(){ $('login').style.display='none'; $('app').style.display='block'; }

async function checkAuth(){
  try{await api('/api/admin/me');showApp();loadPage('dashboard')}
  catch(e){showLogin()}
}

$('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  $('loginMsg').innerHTML='';
  try{
    await api('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:$('pin').value})});
    $('pin').value=''; showApp(); loadPage('dashboard');
  }catch(err){$('loginMsg').innerHTML='<div class="error">'+escapeHtml(err.message)+'</div>'}
});

$('logoutBtn').onclick=async()=>{
  try{await api('/api/admin/logout',{method:'POST'})}catch(e){}
  showLogin();
};

document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>loadPage(b.dataset.page));

function setActive(page){
 document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
}

async function loadPage(page){
 setActive(page);
 if(page==='dashboard') return dashboardPage();
 if(page==='enquiries') return enquiriesPage();
 if(page==='content') return contentPage();
 if(page==='add') return addContentPage();
}

async function dashboardPage(){
 main.innerHTML='<div class="page-title"><h1>Dashboard</h1></div><div class="cards"><div class="stat"><div class="muted">New Enquiries</div><div class="num" id="newCount">—</div></div><div class="stat"><div class="muted">Total Enquiries</div><div class="num" id="totalCount">—</div></div><div class="stat"><div class="muted">Status</div><div class="num">Online</div></div></div><div class="panel"><h3>StockGyan Admin</h3><p class="muted">Manage enquiries and educational content from this dashboard.</p></div>';
 try{
   const d=await api('/api/admin/enquires');
   const rows=Array.isArray(d.enquiries)?d.enquiries:[];
   $('totalCount').textContent=rows.length;
   $('newCount').textContent=rows.filter(x=>(x.status||'new').toLowerCase()==='new').length;
 }catch(e){$('newCount').textContent='!';$('totalCount').textContent='!'}
}

async function enquiriesPage(){
 main.innerHTML=`
 <div class="page-title"><h1>📩 Enquiries</h1><button class="btn green" id="refreshEnq">↻ Refresh</button></div>
 <div id="enqMsg"></div>
 <div class="panel"><div class="table-wrap"><table>
 <thead><tr><th>Name</th><th>Mobile</th><th>Interested In</th><th>Message</th><th>Date/Time</th><th>Status</th><th>Actions</th></tr></thead>
 <tbody id="enqBody"><tr><td colspan="7">Loading…</td></tr></tbody>
 </table></div></div>`;
 $('refreshEnq').onclick=loadEnquiries;
 await loadEnquiries();
}

async function loadEnquiries(){
 const body=$('enqBody'); if(!body)return;
 body.innerHTML='<tr><td colspan="7">Loading…</td></tr>';
 try{
   const data=await api('/api/admin/enquires?ts='+Date.now());
   const rows=Array.isArray(data.enquiries)?data.enquiries:[];
   if(!rows.length){
     body.innerHTML='<tr><td colspan="7"><b>No enquiries returned by API.</b><br><span class="muted">The API responded successfully, but returned an empty enquiries array.</span></td></tr>';
     return;
   }
   body.innerHTML=rows.map(x=>{
     const phone=String(x.phone||'').replace(/[^\d]/g,'');
     const wa=phone.length===10?'91'+phone:phone;
     const msg=x.message||'—';
     const text=`Hello ${x.name||''}, thank you for your enquiry with StockGyan.`;
     return `<tr>
       <td><b>${escapeHtml(x.name||'—')}</b></td>
       <td>${escapeHtml(x.phone||'—')}</td>
       <td>${escapeHtml(x.enquiry_type||'—')}</td>
       <td>${escapeHtml(msg)}</td>
       <td>${escapeHtml(x.created_at||'—')}</td>
       <td><span class="badge">${escapeHtml(x.status||'new')}</span></td>
       <td><div class="actions">
         ${phone?`<a class="btn small green" href="tel:${encodeURIComponent(x.phone)}">Call</a>`:''}
         ${wa?`<a class="btn small primary" target="_blank" rel="noopener" href="https://wa.me/${wa}?text=${encodeURIComponent(text)}">WhatsApp</a>`:''}
       </div></td>
     </tr>`;
   }).join('');
 }catch(e){
   body.innerHTML='<tr><td colspan="7"><div class="error">'+escapeHtml(e.message)+'</div></td></tr>';
 }
}

async function contentPage(){
 main.innerHTML='<div class="page-title"><h1>📝 Content</h1><button class="btn green" onclick="loadPage(\'add\')">＋ Add Content</button></div><div id="contentBox" class="panel">Loading…</div>';
 try{
   const d=await api('/api/admin/content');
   const rows=Array.isArray(d)?d:(d.content||d.items||[]);
   if(!rows.length){$('contentBox').innerHTML='<p class="muted">No content found.</p>';return}
   $('contentBox').innerHTML='<div class="table-wrap"><table><thead><tr><th>Title</th><th>Type</th><th>Status</th><th>Slug</th></tr></thead><tbody>'+
   rows.map(x=>`<tr><td><b>${escapeHtml(x.title||'')}</b><br><span class="muted">${escapeHtml(x.summary||'')}</span></td><td>${escapeHtml(x.content_type||x.type||'')}</td><td>${escapeHtml(x.status||'')}</td><td>${escapeHtml(x.slug||'')}</td></tr>`).join('')+
   '</tbody></table></div>';
 }catch(e){$('contentBox').innerHTML='<div class="error">'+escapeHtml(e.message)+'</div>'}
}

function addContentPage(){
 main.innerHTML=`
 <div class="page-title"><h1>➕ Add Content</h1></div>
 <div class="panel">
 <form id="contentForm"><div class="grid2">
 <div class="field"><label>Title</label><input id="ctTitle" required></div>
 <div class="field"><label>Slug</label><input id="ctSlug" required></div>
 <div class="field full"><label>Summary</label><input id="ctSummary"></div>
 <div class="field"><label>Content Type</label><select id="ctType">
 <option value="article">Article</option><option value="stock">Stock Analysis</option><option value="mutual_fund">Mutual Fund</option><option value="sip">SIP</option><option value="ipo">IPO</option><option value="nfo">NFO</option><option value="strategy">Strategy</option><option value="video">Video</option><option value="pdf">PDF</option>
 </select></div>
 <div class="field"><label>Status</label><select id="ctStatus"><option value="draft">Draft</option><option value="published">Published</option></select></div>
 <div class="field full"><label>Image URL</label><input id="ctImage"></div>
 <div class="field full"><label>Tags</label><input id="ctTags" placeholder="Nifty 50, Stock Analysis"></div>
 <div class="field full"><label>Body</label><textarea id="ctBody"></textarea></div>
 </div><button class="btn primary">Save Content</button><span id="saveMsg" style="margin-left:12px"></span>
 </form></div>`;
 $('ctTitle').oninput=()=>{$('ctSlug').value=$('ctTitle').value.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')};
 $('contentForm').onsubmit=async e=>{
   e.preventDefault();$('saveMsg').textContent='Saving…';
   const payload={title:$('ctTitle').value,slug:$('ctSlug').value,summary:$('ctSummary').value,body:$('ctBody').value,content_type:$('ctType').value,image_url:$('ctImage').value,tags:$('ctTags').value,status:$('ctStatus').value};
   try{await api('/api/admin/content',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});$('saveMsg').innerHTML='<span class="success">Saved successfully.</span>';e.target.reset()}
   catch(err){$('saveMsg').innerHTML='<span class="error">'+escapeHtml(err.message)+'</span>'}
 };
}

function escapeHtml(v){
 return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

checkAuth();
</script>
</body>
</html>
