<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="StockGyan stock analysis and educational insights on listed companies.">
  <title>Stock Analysis | StockGyan</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .analysis-page{padding:48px 0 80px}
    .analysis-wrap{max-width:920px;margin:auto}
    .analysis-meta{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}
    .analysis-meta span,.tags span{display:inline-block;padding:7px 12px;border-radius:999px;background:#e9f6f0;color:#16704f;font-weight:700;font-size:.85rem}
    .analysis-card{background:#fff;border-radius:22px;padding:28px;box-shadow:0 10px 35px rgba(8,30,50,.08)}
    .analysis-card h1{margin:0 0 12px}
    .analysis-summary{font-size:1.08rem;line-height:1.7;color:#4b6070}
    .analysis-body{line-height:1.8;color:#263746}
    .analysis-body h2{margin-top:30px;color:#082b5c}
    .analysis-body ul{padding-left:22px}
    .analysis-image{width:100%;max-height:420px;object-fit:cover;border-radius:18px;margin:0 0 24px}
    .analysis-label{font-size:.8rem;font-weight:800;letter-spacing:.12em;color:#15925f;margin-bottom:12px}
    .error-box{padding:24px;border-radius:16px;background:#fff3f0;color:#9b3b2e}
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a href="/" class="brand"><img src="/assets/stockgyan-brand-logo.png" alt="StockGyan"></a>
      <nav>
        <a href="/">Home</a>
        <a href="/#learn">Learn</a>
        <a href="/analysis/">Stock Analysis</a>
        <a href="/#mutual-funds">Mutual Funds</a>
        <a href="/#strategies">Strategies</a>
        <a href="/#tools">Tools</a>
      </nav>
    </div>
  </header>

  <main class="analysis-page">
    <div class="container analysis-wrap">
      <div id="analysis-content">
        <div class="analysis-card">Loading stock analysis…</div>
      </div>
    </div>
  </main>

  <script>
    (async function () {
      const root = document.getElementById("analysis-content");
      const params = new URLSearchParams(window.location.search);
      const slug = params.get("slug");

      function esc(value) {
        return String(value ?? "").replace(/[&<>"']/g, c => ({
          "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
        }[c]));
      }

      try {
        const url = slug
          ? "/api/content?type=stock&slug=" + encodeURIComponent(slug)
          : "/api/content?type=stock&limit=20";

        const response = await fetch(url, {
          headers: { "Accept": "application/json" },
          cache: "no-store"
        });
        if (!response.ok) throw new Error("API status " + response.status);

        const data = await response.json();
        const items = Array.isArray(data)
          ? data
          : (Array.isArray(data.results) ? data.results : (data.id ? [data] : []));

        const item = slug ? items.find(x => x.slug === slug) || items[0] : items[0];

        if (!item) {
          root.innerHTML = '<div class="error-box"><strong>Analysis not found.</strong><br>Please return to Stock Analysis and select a published analysis.</div>';
          return;
        }

        const tags = String(item.tags || "").split(",").map(x => x.trim()).filter(Boolean);

        root.innerHTML = `
          <article class="analysis-card">
            <div class="analysis-label">STOCK ANALYSIS</div>
            ${item.image_url ? `<img class="analysis-image" src="${esc(item.image_url)}" alt="${esc(item.title)}">` : ""}
            <h1>${esc(item.title)}</h1>
            <p class="analysis-summary">${esc(item.summary || "")}</p>
            ${tags.length ? `<div class="analysis-meta">${tags.map(t => `<span>${esc(t)}</span>`).join("")}</div>` : ""}
            <div class="analysis-body">${item.body || ""}</div>
            <hr>
            <p><strong>Educational disclaimer:</strong> This content is for educational and informational purposes only. It is not investment advice, a recommendation, or a guarantee of returns. Investors should conduct their own research and consider their individual circumstances.</p>
          </article>`;
      } catch (error) {
        console.warn("StockGyan analysis load failed:", error);
        root.innerHTML = '<div class="error-box"><strong>Unable to load the analysis right now.</strong><br>Please refresh the page and try again.</div>';
      }
    })();
  </script>
</body>
</html>
